<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YasIX Store - Next-Gen Cyber Hardware & Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1329;
      --card-bg: rgba(15, 23, 42, 0.75);
      --cyan: #00f5ff;
      --cyan-glow: rgba(0, 245, 255, 0.4);
      --blue: #0066ff;
      --violet: #8a2be2;
      --neon-pink: #ff0055;
      --gold: #ffd700;
      --text: #f0f6ff;
      --muted: #64748b;
      --border: rgba(0, 245, 255, 0.2);
      --border-hover: rgba(0, 245, 255, 0.6);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: none;
      position: relative;
    }

    /* Background Cyber Grid & Orbs */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(0, 245, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      z-index: -1;
      pointer-events: none;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb1 {
      width: 400px;
      height: 400px;
      background: var(--cyan);
      top: -100px;
      left: -100px;
    }

    .orb2 {
      width: 500px;
      height: 500px;
      background: var(--violet);
      bottom: 10%;
      right: -150px;
      animation-delay: -4s;
    }

    .orb3 {
      width: 350px;
      height: 350px;
      background: var(--neon-pink);
      top: 45%;
      left: 30%;
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Custom Cursor */
    .cursor {
      width: 10px;
      height: 10px;
      background: var(--cyan);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
      transition: width 0.2s, height 0.2s, background-color 0.2s;
    }

    .cursor-ring {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(0, 245, 255, 0.6);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.15);
    }

    .cursor-hover .cursor {
      width: 16px;
      height: 16px;
      background: var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-pink);
    }

    .cursor-hover .cursor-ring {
      width: 54px;
      height: 54px;
      border-color: var(--neon-pink);
    }

    /* Base Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* NAV BASE */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 32px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      transition: var(--transition);
      position: relative;
      padding: 4px 0;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--cyan);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    main {
      padding-top: 100px;
      min-height: calc(100vh - 100px);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- Custom Cursor Elements -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- Navigation -->
  <nav>
    <div class="container nav-container">
      <a href="#" class="nav-logo">YAS<span>IX</span></a>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#store">Store</a></li>
        <li><a href="#help">Help</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- Content sections will be added in subsequent commits -->
  </main>

  <script>
    // Custom Cursor Script
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });

    function renderCursor() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    // Hover effect for interactive elements
    const interactiveElements = 'a, button, input, .interactive';
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest(interactiveElements)) {
        document.body.classList.add('cursor-hover');
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest(interactiveElements)) {
        document.body.classList.remove('cursor-hover');
      }
    });
  </script>
</body>
</html>
